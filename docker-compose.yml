services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-interview_pilot}
      MYSQL_USER: ${MYSQL_USER:-interview_pilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-interview_pilot}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-interview_pilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-interview_pilot}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    expose: ["6333", "6334"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-interview_pilot}
      MYSQL_USER: ${MYSQL_USER:-interview_pilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-interview_pilot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-interview_pilot}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-interview_pilot}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET:-}
      # Mail channel is disabled by default (HIRING_MAIL_ENABLED=false) and SMTP is not a
      # Compose dependency; exclude it from the health check so /actuator/health stays UP.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-dashscope}
      AI_STRUCTURED_MAX_ATTEMPTS: ${AI_STRUCTURED_MAX_ATTEMPTS:-2}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
      LLM_LEASE: ${LLM_LEASE:-90s}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_ENABLED: ${DASHSCOPE_ENABLED:-false}
      DASHSCOPE_TIMEOUT: ${DASHSCOPE_TIMEOUT:-30s}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-30s}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_MODEL: ${KIMI_MODEL:-moonshot-v1-8k}
      KIMI_ENABLED: ${KIMI_ENABLED:-false}
      KIMI_TIMEOUT: ${KIMI_TIMEOUT:-30s}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-false}
      KNOWLEDGE_RETRIEVAL: ${KNOWLEDGE_RETRIEVAL:-vector}
      KNOWLEDGE_FILES_ROOT: /app/data/knowledge
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-800}
      KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-100}
      KNOWLEDGE_BATCH_SIZE: ${KNOWLEDGE_BATCH_SIZE:-32}
      KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-5}
      KNOWLEDGE_SIMILARITY_THRESHOLD: ${KNOWLEDGE_SIMILARITY_THRESHOLD:-0.72}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      DASHSCOPE_EMBEDDING_BASE_URL: ${DASHSCOPE_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      DASHSCOPE_EMBEDDING_API_KEY: ${DASHSCOPE_EMBEDDING_API_KEY:-}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v3}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_FILES_ROOT: /app/data/voice
      VOICE_MAX_UPLOAD_BYTES: ${VOICE_MAX_UPLOAD_BYTES:-8388608}
      VOICE_MAX_RECORDING_DURATION: ${VOICE_MAX_RECORDING_DURATION:-5m}
      VOICE_MEDIA_RETENTION: ${VOICE_MEDIA_RETENTION:-7d}
      VOICE_CLEANUP_INTERVAL: ${VOICE_CLEANUP_INTERVAL:-PT10M}
      VOICE_CLEANUP_INITIAL_DELAY: ${VOICE_CLEANUP_INITIAL_DELAY:-PT2M}
      VOICE_CLEANUP_BATCH_SIZE: ${VOICE_CLEANUP_BATCH_SIZE:-50}
      VOICE_CLEANUP_STUCK_TASK_THRESHOLD: ${VOICE_CLEANUP_STUCK_TASK_THRESHOLD:-PT30M}
      VOICE_CLEANUP_ORPHAN_GRACE: ${VOICE_CLEANUP_ORPHAN_GRACE:-PT24H}
      VOICE_CLEANUP_CLAIM_TTL: ${VOICE_CLEANUP_CLAIM_TTL:-PT30M}
      DASHSCOPE_SPEECH_BASE_URL: ${DASHSCOPE_SPEECH_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      DASHSCOPE_SPEECH_API_KEY: ${DASHSCOPE_SPEECH_API_KEY:-}
      DASHSCOPE_ASR_MODEL: ${DASHSCOPE_ASR_MODEL:-fun-asr-flash-2026-06-15}
      DASHSCOPE_ASR_TIMEOUT: ${DASHSCOPE_ASR_TIMEOUT:-60s}
      DASHSCOPE_TTS_MODEL: ${DASHSCOPE_TTS_MODEL:-cosyvoice-v3-flash}
      DASHSCOPE_TTS_VOICE: ${DASHSCOPE_TTS_VOICE:-longanyang}
      DASHSCOPE_TTS_TIMEOUT: ${DASHSCOPE_TTS_TIMEOUT:-30s}
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - knowledge_files:/app/data/knowledge
      - voice_files:/app/data/voice
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  knowledge_files:
  voice_files:
