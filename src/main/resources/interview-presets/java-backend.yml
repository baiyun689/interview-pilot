id: java-backend
displayName: Java 后端开发
description: 面向 Java、Spring 与主流数据中间件的后端岗位
jobTitle: Java 后端开发工程师
jobDescription: |
  负责 Java 后端服务的设计、开发、测试与持续演进，能够围绕真实业务需求完成接口、数据模型和异步流程设计。
  熟悉 Java 核心语法、集合、JVM 与并发编程，理解线程安全、内存模型、锁与常见性能问题。
  熟悉 Spring Boot、Spring MVC、事务、AOP 和常用工程实践，能够定位依赖注入、事务边界与请求链路问题。
  熟悉 MySQL 索引、事务、锁、执行计划和性能优化，了解 Redis 缓存、一致性、热点与高可用问题。
  了解消息队列的幂等、重试、顺序、积压和死信处理，以及分布式系统中的超时、限流、降级、可观测性与故障恢复。
  能够结合项目经历说明个人职责、技术选型、失败窗口、指标效果和演进取舍。
