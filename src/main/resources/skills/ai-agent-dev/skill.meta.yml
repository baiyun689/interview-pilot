
displayName: AI Agent 开发
description: 面向大模型应用、Agent、Prompt、RAG 与生产可靠性的工程面试。
group: JOB
display:
  icon: bot
  gradient: from-violet-500 to-fuchsia-500
  iconBg: bg-violet-100 dark:bg-violet-900/30
  iconColor: text-violet-600 dark:text-violet-400
retrievalScopes:
  - ai-agent
  - tool-use
  - rag
  - mcp
  - system-design
defaultStages:
  - project_deep_dive
  - agent_architecture
  - tool_orchestration
stages:
  - id: project_deep_dive
    purpose: 获取候选人的真实项目、个人贡献、业务约束和效果证据
  - id: architecture
    purpose: 验证 Agent、RAG、Prompt 与工具编排的机制和架构取舍
  - id: reliability
    purpose: 验证安全、评估、故障恢复、延迟和成本控制
allowedTools:
  - rag.search
ragKeywords:
  - 原理
  - 架构
  - 机制
  - 推理
  - 幻觉
  - 上下文
  - 向量
  - 检索
  - 微调
  - 提示词
  - 工具调用
  - 编排
  - rag
  - embedding
  - llm
  - prompt
  - fine-tuning
  - agent
  - inference
  - hallucination
  - context
  - retrieval
  - tool use
  - orchestration
  - mcp
defaultCompetencies:
  - Agent 架构
  - Prompt 工程
  - RAG 设计
  - 工具调用
  - 评估与可观测性
  - 生产可靠性
competencies:
  - id: agent_architecture
    name: Agent 架构
    objective: 验证候选人能否设计任务循环、状态、记忆、终止条件和失败恢复
    requiredEvidence: [任务状态模型, 循环与终止条件, 记忆边界, 失败恢复]
    questionModes: [PROJECT, ARCHITECTURE, FAILURE, TRADEOFF]
    followUpAxes: [state, control, failure, tradeoff]
    redFlags: [把 Agent 等同于一次 Prompt]
    followUpLimit: 2
  - id: prompt_engineering
    name: Prompt 工程
    objective: 验证结构化输出、防注入和回归测试能力
    requiredEvidence: [Prompt 边界, 结构化输出, 注入防护, 回归评估]
    questionModes: [PROJECT, MECHANISM, FAILURE, METRICS]
    followUpAxes: [mechanism, security, evaluation]
    redFlags: [只凭人工感觉调 Prompt]
    followUpLimit: 2
  - id: rag_design
    name: RAG 设计
    objective: 验证可评估、可溯源、可演进的 RAG 设计能力
    requiredEvidence: [切分策略及依据, 召回过滤与重排, 相关性评估, 溯源与新鲜度]
    questionModes: [PROJECT, MECHANISM, ARCHITECTURE, FAILURE, METRICS, TRADEOFF]
    followUpAxes: [chunking, retrieval, rerank, evaluation, provenance]
    redFlags: [只说向量检索, 没有离线或线上评估]
    followUpLimit: 2
    rag:
      enabled: true
      scopes: [rag, search]
      allowedUses: [GENERATE_SCENARIO, VERIFY_FACT]
  - id: tool_mcp
    name: 工具调用
    objective: 验证工具和 MCP 的接口、权限、重试、沙箱与审计设计
    requiredEvidence: [Schema 约束, 权限与沙箱, 重试幂等, 审计与注入防护]
    questionModes: [PROJECT, ARCHITECTURE, FAILURE, TRADEOFF]
    followUpAxes: [schema, permission, retry, audit]
    redFlags: [不考虑权限或不可信工具结果]
    followUpLimit: 2
  - id: evaluation_observability
    name: 评估与可观测性
    objective: 验证离线评估、线上指标、追踪和质量防回归能力
    requiredEvidence: [离线评测集, 线上质量指标, Trace 与归因, 回归门禁]
    questionModes: [PROJECT, METRICS, FAILURE, TRADEOFF]
    followUpAxes: [dataset, metric, tracing, regression]
    redFlags: [没有任何质量度量]
    followUpLimit: 2
  - id: production_reliability
    name: 生产可靠性
    objective: 验证模型错误、注入、依赖故障、延迟和成本控制
    requiredEvidence: [超时重试, 降级兜底, 注入防护, 延迟成本与监控]
    questionModes: [PROJECT, ARCHITECTURE, FAILURE, METRICS, TRADEOFF]
    followUpAxes: [failure, fallback, security, latency, cost]
    redFlags: [只讲正常流程]
    followUpLimit: 2
references:
  - system-design-scenarios.md
  - distributed.md
  - high-availability.md
runtime:
  ragEnabled: false
  toolsEnabled: false
