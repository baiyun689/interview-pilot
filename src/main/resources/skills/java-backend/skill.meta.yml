
displayName: Java 后端
description: 面向 Spring Boot、数据库、缓存、并发与分布式系统的工程面试。
group: JOB
display:
  icon: code
  gradient: from-blue-500 to-indigo-500
  iconBg: bg-blue-100 dark:bg-blue-900/30
  iconColor: text-blue-600 dark:text-blue-400
retrievalScopes:
  - java
  - spring
  - mysql
  - redis
  - system-design
defaultStages:
  - project_deep_dive
  - technical_depth
  - coding_readiness
stages:
  - id: project_deep_dive
    purpose: 获取候选人的真实项目、个人贡献、约束、指标和事故证据
  - id: technical_depth
    purpose: 验证 Java 后端核心技术的机制、边界和方案取舍
  - id: reliability
    purpose: 验证故障处理、可观测性、回滚和系统演进能力
allowedTools:
  - rag.search
ragKeywords:
  - 原理
  - 源码
  - 机制
  - 设计
  - 架构
  - 一致性
  - 并发
  - 事务
  - 索引
  - 缓存
  - 限流
  - 降级
  - 重试
  - jvm
  - gc
  - 垃圾回收
  - 类加载
  - 字节码
  - 锁
  - 线程池
  - rollback
  - transaction
  - concurrent
  - index
  - cache
  - deadlock
  - classloader
defaultCompetencies:
  - 项目深挖
  - Java 基础与并发
  - Spring 与事务
  - MySQL
  - Redis
  - 分布式与高可用
competencies:
  - id: project_ownership
    name: 项目深挖
    objective: 验证个人贡献、业务约束、核心指标和事故处理
    requiredEvidence: [个人贡献边界, 关键约束, 核心指标, 真实问题与恢复]
    questionModes: [PROJECT, FAILURE, METRICS, TRADEOFF]
    followUpAxes: [ownership, constraint, metric, incident]
    redFlags: [无法区分个人和团队成果]
    followUpLimit: 2
  - id: java_concurrency
    name: Java 基础与并发
    objective: 验证 Java 机制、并发语义和工程边界
    requiredEvidence: [核心机制, 并发安全, 性能边界, 实际使用依据]
    questionModes: [PROJECT, CONCEPT, MECHANISM, FAILURE, CODING]
    followUpAxes: [mechanism, concurrency, performance, boundary]
    redFlags: [只背定义无法连接实现]
    followUpLimit: 2
  - id: spring_transaction
    name: Spring 与事务
    objective: 验证 Spring 运行机制、事务边界、传播和异常处理
    requiredEvidence: [代理与调用边界, 事务传播, 回滚条件, 失败处理]
    questionModes: [PROJECT, MECHANISM, FAILURE, TRADEOFF]
    followUpAxes: [proxy, boundary, propagation, rollback]
    redFlags: [只知道注解用法]
    followUpLimit: 2
    rag:
      enabled: true
      scopes: [spring, distributed]
      allowedUses: [GENERATE_SCENARIO, VERIFY_FACT]
      topK: 4
      candidateCount: 12
      minimumScore: 0.75
      contextCharacterBudget: 4000
  - id: mysql
    name: MySQL
    objective: 验证数据模型、索引、事务锁和慢查询治理
    requiredEvidence: [访问模式与建模, 索引依据, 事务与锁, 定位和优化指标]
    questionModes: [PROJECT, MECHANISM, FAILURE, METRICS, TRADEOFF]
    followUpAxes: [index, lock, transaction, diagnosis]
    redFlags: [只会罗列索引规则]
    followUpLimit: 2
  - id: redis
    name: Redis
    objective: 验证缓存设计、一致性、热点和故障恢复
    requiredEvidence: [缓存适用性, 一致性策略, 热点与穿透防护, 故障降级]
    questionModes: [PROJECT, ARCHITECTURE, FAILURE, METRICS, TRADEOFF]
    followUpAxes: [consistency, hotspot, failure, metric]
    redFlags: [默认把 Redis 当数据库]
    followUpLimit: 2
  - id: distributed_reliability
    name: 分布式与高可用
    objective: 验证一致性、幂等、容量、降级、恢复和演进
    requiredEvidence: [一致性与幂等, 容量和 SLO, 降级恢复, 可观测与演练]
    questionModes: [ARCHITECTURE, FAILURE, METRICS, TRADEOFF]
    followUpAxes: [consistency, capacity, recovery, evolution]
    redFlags: [高可用停留在口号]
    followUpLimit: 2
references:
  - java.md
  - spring.md
  - mysql.md
  - redis.md
  - distributed.md
  - high-availability.md
  - mq.md
runtime:
  ragEnabled: false
  toolsEnabled: false
