spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:interview_pilot}
    username: ${MYSQL_USER:interview_pilot}
    password: ${MYSQL_PASSWORD:interview_pilot}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
logging:
  pattern:
    # traceId is set globally by TraceIdFilter (common.observability) for HTTP paths; the
    # console pattern prints it on every line so voice/async event logs are correlated without
    # a separate traceId= field (RabbitMQ listener threads have no HTTP traceId — correlate
    # those via taskId + executionEpoch, plan §16).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] [%X{traceId:-}] %c{1.} - %m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

server:
  # The Compose app is reachable only through the trusted Nginx service. Nginx overwrites the
  # forwarding chain, so Spring may safely adapt remoteAddr for per-client rate limits.
  forward-headers-strategy: framework

app:
  jwt:
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    hmac-secret: ${JWT_HMAC_SECRET}
  rate-limit:
    llm-max-concurrency: ${LLM_MAX_CONCURRENCY:4}
    llm-lease: ${LLM_LEASE:90s}
  async:
    rabbit:
      dispatch-interval: 10s
      dispatch-initial-delay: 10s
      republish-after: 30s
      confirm-timeout: 5s
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:dashscope}
    structured-max-attempts: ${AI_STRUCTURED_MAX_ATTEMPTS:2}
    providers:
      dashscope:
        display-name: DashScope
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${DASHSCOPE_API_KEY:}
        model: ${DASHSCOPE_MODEL:qwen-plus}
        enabled: ${DASHSCOPE_ENABLED:false}
        timeout: ${DASHSCOPE_TIMEOUT:30s}
        extra-body:
          enable_thinking: false
      deepseek:
        display-name: DeepSeek
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        model: ${DEEPSEEK_MODEL:deepseek-chat}
        enabled: ${DEEPSEEK_ENABLED:false}
        timeout: ${DEEPSEEK_TIMEOUT:30s}
      kimi:
        display-name: Kimi
        base-url: ${KIMI_BASE_URL:https://api.moonshot.cn}
        api-key: ${KIMI_API_KEY:}
        model: ${KIMI_MODEL:moonshot-v1-8k}
        enabled: ${KIMI_ENABLED:false}
        timeout: ${KIMI_TIMEOUT:30s}
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:false}
    files-root: ${KNOWLEDGE_FILES_ROOT:./data/knowledge}
    chunk-size: ${KNOWLEDGE_CHUNK_SIZE:800}
    chunk-overlap: ${KNOWLEDGE_CHUNK_OVERLAP:100}
    batch-size: ${KNOWLEDGE_BATCH_SIZE:32}
    collection-name: knowledge_chunks_v1
    top-k: ${KNOWLEDGE_TOP_K:5}
    candidate-count: ${KNOWLEDGE_CANDIDATE_COUNT:15}
    context-character-budget: ${KNOWLEDGE_CONTEXT_CHARACTER_BUDGET:6000}
    similarity-threshold: ${KNOWLEDGE_SIMILARITY_THRESHOLD:0.72}
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_PORT:6334}
    embedding:
      base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_EMBEDDING_API_KEY:}
      model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
      dimensions: 1024
  voice:
    enabled: ${VOICE_ENABLED:false}
    files-root: ${VOICE_FILES_ROOT:./data/voice}
    max-upload-bytes: ${VOICE_MAX_UPLOAD_BYTES:8388608}
    max-recording-duration: ${VOICE_MAX_RECORDING_DURATION:5m}
    retention: ${VOICE_MEDIA_RETENTION:7d}
    cleanup-interval: ${VOICE_CLEANUP_INTERVAL:PT10M}
    cleanup-initial-delay: ${VOICE_CLEANUP_INITIAL_DELAY:PT2M}
    cleanup:
      batch-size: ${VOICE_CLEANUP_BATCH_SIZE:50}
      stuck-task-threshold: ${VOICE_CLEANUP_STUCK_TASK_THRESHOLD:PT30M}
      orphan-grace: ${VOICE_CLEANUP_ORPHAN_GRACE:PT24H}
      claim-ttl: ${VOICE_CLEANUP_CLAIM_TTL:PT30M}
    asr:
      provider: dashscope
      base-url: ${DASHSCOPE_SPEECH_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${DASHSCOPE_SPEECH_API_KEY:}
      model: ${DASHSCOPE_ASR_MODEL:fun-asr-flash-2026-06-15}
      timeout: ${DASHSCOPE_ASR_TIMEOUT:60s}
    tts:
      provider: dashscope
      model: ${DASHSCOPE_TTS_MODEL:cosyvoice-v3-flash}
      voice: ${DASHSCOPE_TTS_VOICE:longanyang}
      timeout: ${DASHSCOPE_TTS_TIMEOUT:30s}
