server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Voice recording uploads (multipart audio up to 8 MiB + boundary overhead) exceed the
    # nginx default 1m body limit. Plan §15: lift it for exactly this route, keep every other
    # /api route at the default. The proxy settings mirror the /api/ location — nginx sibling
    # locations do not share configuration, so keep both in sync.
    location ~ ^/api/interviews/[^/]+/turns/[^/]+/voice-recordings$ {
        client_max_body_size 9m;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the only public application ingress in Compose. Overwrite, rather than append,
        # so an untrusted browser cannot inject the address used by Spring's per-IP limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header X-Accel-Buffering no always;
    }

    # Realtime voice interview WebSocket (streaming ASR -> turn engine -> realtime TTS).
    # A WS handshake needs the Upgrade/Connection hop and a long read timeout so an ongoing
    # interview (mostly idle while the candidate thinks/speaks) is not torn down by nginx's
    # 60s default. Sibling locations don't share config, hence the repeated proxy headers.
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the only public application ingress in Compose. Overwrite, rather than append,
        # so an untrusted browser cannot inject the address used by Spring's per-IP limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header X-Accel-Buffering no always;
    }

    location = /actuator/health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
